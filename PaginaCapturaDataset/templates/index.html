<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Captura de Dataset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Captura de imágenes para dataset</h1>
    <p>Selecciona una fruta, colócala en el recuadro y guarda fotos etiquetadas.</p>
</header>

<main>
    <section class="panel">
        <h2>Clase de la fruta</h2>

        <select id="clase">
            {% for clase in clases %}
                <option value="{{ clase }}">{{ clase }}</option>
            {% endfor %}
        </select>

        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>

            <div class="guide-box">
                <span>Coloca la fruta aquí</span>
            </div>
        </div>

        <canvas id="canvas" hidden></canvas>

        <button id="btnGuardar">Guardar foto</button>

        <p id="mensaje"></p>
    </section>

    <section class="panel">
        <h2>Vista previa guardada</h2>
        <img id="preview" alt="Última foto capturada">
    </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
